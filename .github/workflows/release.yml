name: Release

# A `v*` tag publishes a GitHub release: the macOS DMG, the updater archive
# and its `latest.json` feed (which installed copies poll), and the host
# packages that SSH setup and "Update Host" download for that exact version,
# and the unsigned iOS IPA that LiveContainer installs from
# releases/latest/download/SideMobile.ipa.
# Running it by hand builds everything without publishing. A push to main
# builds without publishing too, which keeps the Rust cache warm: a tag run
# can only restore caches saved on main, not ones from earlier tags.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  host:
    name: Host package (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --target darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.sha256
          if-no-files-found: error

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF). Run npm run set-version first." >&2
            exit 1
          fi

      # Ad-hoc signed (no Apple Developer ID): macOS asks to confirm the first
      # launch. Updates are verified with the Tauri updater key instead.
      - name: Build the app, DMG and signed updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify the package
        run: |
          set -euo pipefail
          BUNDLE=target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/sIDE.app"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          [ "$(lipo -archs "$APP/Contents/MacOS/$EXE")" = arm64 ] || { echo "Expected an arm64 executable" >&2; exit 1; }
          [ "$ID" = dev.sidoexe.side ] || { echo "Unexpected bundle identifier $ID" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls "$BUNDLE"/dmg/*.dmg "$BUNDLE"/macos/sIDE.app.tar.gz "$BUNDLE"/macos/sIDE.app.tar.gz.sig

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/sIDE.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/sIDE.app.tar.gz.sig
          if-no-files-found: error

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: ios/build-ipa.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: ios/build/SideMobile.ipa
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: host-packages
          path: dist/host
      - uses: actions/download-artifact@v4
        with:
          name: ios-packages
          path: dist/ios

      - name: Write the updater feed
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SIG=$(find dist/macos -name 'sIDE.app.tar.gz.sig' | head -1)
          [ -n "$SIG" ] || { echo "Missing updater signature" >&2; exit 1; }
          VERSION="$VERSION" SIG="$SIG" \
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/sIDE.app.tar.gz" \
            node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("dist/latest.json", JSON.stringify({
            version: process.env.VERSION,
            notes: `sIDE ${process.env.VERSION}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": {
                signature: fs.readFileSync(process.env.SIG, "utf8").trim(),
                url: process.env.URL,
              },
            },
          }, null, 2));
          NODE

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          mapfile -t FILES < <(find dist/macos dist/host dist/ios -type f; echo dist/latest.json)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "sIDE $VERSION" --generate-notes --prerelease="$PRERELEASE"
          fi
